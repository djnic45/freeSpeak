<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk Board</title>
<style>
html,body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,sans-serif;color:#fff;
background:radial-gradient(circle at 20% 15%,rgba(80,120,255,.25),transparent 45%),radial-gradient(circle at 85% 90%,rgba(160,80,255,.22),transparent 50%),linear-gradient(160deg,#0b1026,#141a3a 50%,#1b0f2e);background-attachment:fixed}
main{max-width:760px;margin:auto;padding:24px}
h1{text-align:center;font-size:30px;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
button{font:inherit;border:0;border-radius:18px;cursor:pointer}
.card{background:#2b6cf6;color:#fff;min-height:120px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.card span{font-size:44px}
.card[aria-pressed=true]{background:#ffd23f;color:#111;outline:4px solid #fff}
h2{font-size:22px;margin:26px 0 10px;text-align:center}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.scale button{background:#ddd;color:#111;min-height:80px;font-size:20px}
.scale button[aria-pressed=true]{background:#ffd23f;outline:4px solid #fff}
#msg{margin:24px 0 12px;background:rgba(0,0,0,.35);border-radius:18px;padding:18px;font-size:22px;min-height:60px;text-align:center}
.bar{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.bar button{min-height:72px;font-size:22px;background:#ddd;color:#111}
</style></head><body><main>
<p style="text-align:center;font-size:18px;margin:0;opacity:.85">🔊 Turn your sound on and silent mode off to hear it speak.</p>
<h1>How are you feeling?</h1>
<div class="grid" id="feel">
<button type="button" class="card" aria-pressed="false"><span>😊</span>Happy</button>
<button type="button" class="card" aria-pressed="false"><span>😌</span>Calm</button>
<button type="button" class="card" aria-pressed="false"><span>😴</span>Tired</button>
<button type="button" class="card" aria-pressed="false"><span>😟</span>Worried</button>
<button type="button" class="card" aria-pressed="false"><span>😠</span>Frustrated</button>
<button type="button" class="card" aria-pressed="false"><span>😢</span>Sad</button>
<button type="button" class="card" aria-pressed="false"><span>🤩</span>Excited</button>
<button type="button" class="card" aria-pressed="false"><span>🤒</span>Sick</button>
<button type="button" class="card" aria-pressed="false"><span>🥰</span>Loved</button>
</div>
<h2 style="display:flex;align-items:center;justify-content:center;gap:14px">How strong is it? <button type="button" id="play2" aria-label="Play how strong" style="background:#ffd23f;color:#111;font-size:22px;min-height:56px;padding:0 22px">▶ Play</button></h2>
<div class="scale" id="lvl">
<button type="button" aria-pressed="false">A little</button><button type="button" aria-pressed="false">Kind of</button><button type="button" aria-pressed="false">Pretty</button><button type="button" aria-pressed="false">Really</button><button type="button" aria-pressed="false">Very</button>
</div>
<h2>Quick words</h2>
<div class="grid" id="quick">
<button type="button" class="card qk"><span>👍</span>Yes</button><button type="button" class="card qk"><span>👎</span>No</button><button type="button" class="card qk"><span>🙏</span>Thank you</button>
<button type="button" class="card qk"><span>🍔</span>I am hungry</button><button type="button" class="card qk"><span>🥤</span>I am thirsty</button><button type="button" class="card qk"><span>🆘</span>I need help</button>
<button type="button" class="card qk"><span>🚻</span>I need the bathroom</button><button type="button" class="card qk"><span>⏸️</span>Please wait</button><button type="button" class="card qk"><span>❤️</span>I love you</button>
</div>
<div id="spk" aria-live="polite" style="text-align:center;font-size:20px;min-height:28px;margin-top:16px"></div>
<div id="msg" aria-live="polite">Pick a feeling to start.</div>
<div class="bar" style="grid-template-columns:repeat(3,1fr)"><button type="button" id="say" style="background:#ffd23f">🔊 Say it</button><button type="button" id="clear">Start over</button><button type="button" id="share">Share with my helper (asks first)</button></div>
<p style="text-align:center;font-size:16px;opacity:.7;margin-top:24px">Early prototype for demo only. Not a medical device.</p>
</main><script>
let f='',l='';
function pick(g,b){document.querySelectorAll('#'+g+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));}
document.querySelectorAll('#feel button').forEach(b=>b.onclick=()=>{pick('feel',b);f=b.textContent.replace(/\p{Extended_Pictographic}/u,'').trim();upd();speak(document.getElementById('msg').textContent)});
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{pick('lvl',b);l=b.textContent;upd();speak(f?document.getElementById('msg').textContent:l)});
document.getElementById('play2').onclick=()=>speak(f?document.getElementById('msg').textContent:(l||'Pick a feeling first'));
document.querySelectorAll('.qk').forEach(b=>b.onclick=()=>{const t=b.textContent.replace(/\p{Extended_Pictographic}|\uFE0F/gu,'').trim();document.getElementById('msg').textContent=t+'.';speak(t)});
let vc=null;function pickVoice(){const v=speechSynthesis.getVoices();vc=v.find(x=>x.lang==='en-US'&&x.localService)||v.find(x=>x.lang&&x.lang.startsWith('en'))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){const ind=document.getElementById('spk');if(!('speechSynthesis' in window)){ind.textContent='This browser cannot speak.';return}
 speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(vc)u.voice=vc;u.rate=0.95;u.volume=1;
 u.onstart=()=>ind.textContent='🔊 Speaking...';u.onend=()=>ind.textContent='';u.onerror=()=>ind.textContent='No sound? Turn silent mode off and turn volume up.';
 speechSynthesis.speak(u);setTimeout(()=>{if(!speechSynthesis.speaking&&ind.textContent==='')ind.textContent='No sound? Turn silent mode off and turn volume up.'},1500)}
function upd(){document.getElementById('msg').textContent=f?('I am '+(l?l.toLowerCase()+' ':'')+f.toLowerCase()+'.'):'Pick a feeling to start.'}
document.getElementById('say').onclick=()=>speak(document.getElementById('msg').textContent);
document.getElementById('clear').onclick=()=>{f=l='';pick('feel',null);pick('lvl',null);upd()};
document.getElementById('share').onclick=()=>alert('Concept only: nothing is sent. In a real version you would choose who sees this, every time.');
</script></body></html>
